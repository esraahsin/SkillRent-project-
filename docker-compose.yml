services:
  backend:
    build:
      context: ./backend
    environment:
      PORT: 4000
      HOST: 0.0.0.0
      FRONTEND_ORIGIN: "http://localhost:5173,http://localhost:5174"
      ALLOW_NO_ORIGIN: "true"
      AI_SERVICE_URL: "http://ai_service:8000"
      AI_TIMEOUT_MS: "4000"
    ports:
      - "4000:4000"
    depends_on:
      - ai_service

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:5173"

  ai_service:
    build:
      context: ./ai_service
    ports:
      - "8000:8000"
    environment:
      MODEL_PATH: "./fine_tuned_model"
    volumes:
      # Mount fine-tuned model if it exists locally
      - ./ai_service/fine_tuned_model:/app/fine_tuned_model:ro